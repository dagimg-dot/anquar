<!doctype html>
<html lang="en" data-theme="dark" style="background: __GROUND__">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Guilt-free doomscrolling — books in a TikTok-style feed"
    >
    <meta name="theme-color" content="__GROUND__">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Anquar">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png">
    <!--apple-startup-->
    <script>
    "use strict";
    (() => {
      const t = localStorage.theme;
      const m = window.matchMedia("(prefers-color-scheme: dark)");
      const isDark = t === "dark" || (!t && m.matches) || t !== "light";
      document.documentElement.setAttribute(
        "data-theme",
        isDark ? "dark" : "light"
      );
    })();
    </script>
    <title>anquar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
