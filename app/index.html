<!doctype html>
<html lang="en" data-theme="dark" style="background: __GROUND__">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <meta
      name="description"
      content="Guilt-free bookscrolling: books as a vertical feed, one screen at a time"
    >
    <meta name="theme-color" content="__GROUND__">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="anquar">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png">
    <!--apple-startup-->
    <script>
    "use strict";
    (() => {
      const t = localStorage.theme;
      const m = window.matchMedia("(prefers-color-scheme: dark)");
      const isDark = t === "dark" || (!t && m.matches) || t !== "light";
      document.documentElement.setAttribute(
        "data-theme",
        isDark ? "dark" : "light"
      );
    })();
    </script>
    <style>
      #splash { position: fixed; inset: 0; z-index: 2147483647; }
      #splash > div { position: absolute; inset: 0; background: __GROUND__; }
      #splash > svg { position: absolute; left: 0; top: 0; overflow: visible; color: __INK__; }
      #splash[data-entry="build"] > svg { visibility: hidden; }
    </style>
    <title>anquar</title>
  </head>
  <body>
    <div id="splash"><div></div><svg viewBox="0 0 64 64" aria-hidden="true"><!--mark--></svg></div>
    <script>
    "use strict";
    // The splash's first frame, placed before the bundle loads; src/splash.ts takes it from here. Only an
    // installed app has one. On Android the phone has just shown its own splash, the icon's mark centred on
    // the whole screen, and our page starts below the status bar, so the mark goes exactly where that one is.
    (() => {
      const el = document.getElementById("splash");
      const standalone =
        matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
      if (!standalone) return el.remove();
      const android = /Android/.test(navigator.userAgent);
      const svg = el.lastElementChild;
      const place = () => {
        const vv = window.visualViewport;
        const W = vv ? vv.width : innerWidth;
        const H = vv && Math.abs(vv.height - innerHeight) < 1 ? vv.height : innerHeight;
        const top = screen.availTop || 0;
        const sh = Math.abs(screen.height - (top + H)) < 1 ? top + H : screen.height;
        const cy = android && top > 0 ? sh / 2 - top : H / 2;
        const s = __SPLASH_BOX__;
        const box = { x: W / 2 - s / 2, y: cy - s / 2, s };
        svg.style.width = svg.style.height = `${s}px`;
        svg.style.transform = `translate(${box.x}px, ${box.y}px)`;
        return box;
      };
      place();
      addEventListener("resize", place);
      el.dataset.entry = android ? "hold" : "build";
      window.__anquarSplash = { t0: performance.now(), entry: el.dataset.entry, place };
    })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
